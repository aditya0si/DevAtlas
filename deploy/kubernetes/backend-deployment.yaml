apiVersion: apps/v1
kind: Deployment
metadata:
  name: devatlas-backend
  labels:
    app: devatlas
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devatlas
      component: backend
  template:
    metadata:
      labels:
        app: devatlas
        component: backend
    spec:
      containers:
        - name: backend
          image: devatlas/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: devatlas-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devatlas-secrets
                  key: github-token
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devatlas-secrets
                  key: openai-api-key
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devatlas-secrets
                  key: jwt-secret-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: devatlas-backend
spec:
  selector:
    app: devatlas
    component: backend
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP