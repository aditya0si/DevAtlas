apiVersion: apps/v1
kind: Deployment
metadata:
  name: devatlas-nginx
  labels:
    app: devatlas
    component: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devatlas
      component: nginx
  template:
    metadata:
      labels:
        app: devatlas
        component: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: nginx-certs
              mountPath: /etc/nginx/certs
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: nginx-config
          configMap:
            name: devatlas-nginx-config
        - name: nginx-certs
          secret:
            secretName: devatlas-tls
---
apiVersion: v1
kind: Service
metadata:
  name: devatlas-nginx
spec:
  selector:
    app: devatlas
    component: nginx
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 443
      targetPort: 443
      name: https
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devatlas-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - devatlas.io
        - api.devatlas.io
      secretName: devatlas-tls
  rules:
    - host: devatlas.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devatlas-frontend
                port:
                  number: 80
    - host: api.devatlas.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devatlas-backend
                port:
                  number: 80