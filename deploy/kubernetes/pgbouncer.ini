# PgBouncer Configuration for DevAtlas
# Transaction-mode pooling with read/write splitting

[databases]
# Primary database - handles all writes
devatlas_primary = host=postgres-primary.devatlas.svc.cluster.local port=5432 dbname=devatlas

# Read replica - handles read queries
devatlas_replica = host=postgres-replica.devatlas.svc.cluster.local port=5432 dbname=devatlas

# Default pool (fallback)
devatlas = host=postgres-primary.devatlas.svc.cluster.local port=5432 dbname=devatlas

[pgbouncer]
# Connection settings
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

# Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = $1

# Pool mode: transaction (required for read/write splitting)
pool_mode = transaction

# Maximum connections
max_client_conn = 1000
default_pool_size = 25

# Per-user pool settings
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

# Server connection settings
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 3

# Query timeout
query_timeout = 30
query_wait_timeout = 30
idle_transaction_timeout = 60

# Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

# Health check
healthcheck_period = 30
healthcheck_timeout = 10
healthcheck_database = postgres

# Replication lag tolerance (for replica selection)
# Replica lags beyond this are excluded from pool
max_db_connections = 100

# Don't use server_reset_on_return (not needed in transaction mode)
server_reset_query = DISCARD ALL

# Performance
pkt_buf = 4096
max_packet_size = 2147483647
sbuf_recvbuf = 4096
sbuf_sendbuf = 4096

# DNS caching
dns_max_ttl = 15
dns_zone_check_period = 300

# Admin console
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

# Timezone
timezone = UTC

# ─────────────────────────────────────────────────────────────────────────────
# Read/Write Splitting Configuration
# ─────────────────────────────────────────────────────────────────────────────
# 
# In transaction mode, PgBouncer automatically routes queries based on:
# 1. START TRANSACTION / BEGIN → route to primary
# 2. COMMIT / ROLLBACK → route to replica for subsequent reads
# 3. SET SESSION variables → route to primary
# 4. SET TRANSACTION → route to primary
# 5. PREPARE / EXECUTE → route to primary
# 6. COPY / LISTEN / NOTIFY → route to primary
#
# For explicit read/write splitting, applications should:
# - Use connection string: postgresql://user:pass@pgbouncer:6432/devatlas_primary (writes)
# - Use connection string: postgresql://user:pass@pgbouncer:6432/devatlas_replica (reads)
#
# Or use route_by_late_binding plugin for automatic splitting based on transaction type.

# ─────────────────────────────────────────────────────────────────────────────
# Application Connection Examples
# ─────────────────────────────────────────────────────────────────────────────
#
# Write operations (creates, updates, deletes):
#   postgresql+asyncpg://devatlas:password@pgbouncer:6432/devatlas_primary
#
# Read operations (SELECT queries):
#   postgresql+asyncpg://devatlas:password@pgbouncer:6432/devatlas_replica
#
# Default (transaction routing):
#   postgresql+asyncpg://devatlas:password@pgbouncer:6432/devatlas
#
# For automatic read/write splitting in application code:
#   - Use a proxy like PgBouncer with route_by_late_binding
#   - Or implement connection routing in application layer
#   - Or use a read replica connection pool with automatic failover

# ─────────────────────────────────────────────────────────────────────────────
# Kubernetes Service Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# Services should be configured as:
#
# apiVersion: v1
# kind: Service
# metadata:
#   name: pgbouncer-primary
# spec:
#   selector:
#     app: pgbouncer
#   ports:
#   - port: 6432
#     targetPort: 6432
# ---
# apiVersion: v1
# kind: Service
# metadata:
#   name: pgbouncer-replica
# spec:
#   selector:
#     app: pgbouncer
#   ports:
#   - port: 6432
#     targetPort: 6432
# ---
# apiVersion: v1
# kind: Service
# metadata:
#   name: pgbouncer
# spec:
#   selector:
#     app: pgbouncer
#   ports:
#   - port: 6432
#     targetPort: 6432

# ─────────────────────────────────────────────────────────────────────────────
# Backend API Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# In backend/app/core/config.py, configure:
#
# class DatabaseURLs:
#     PRIMARY = "postgresql+asyncpg://devatlas:password@pgbouncer-primary:6432/devatlas_primary"
#     REPLICA = "postgresql+asyncpg://devatlas:password@pgbouncer-replica:6432/devatlas_replica"
#     DEFAULT = "postgresql+asyncpg://devatlas:password@pgbouncer:6432/devatlas"
#
# For read/write splitting in SQLAlchemy:
# - Use replication tuple: (PRIMARY, [REPLICA])
# - Or use a custom routing session that sends writes to PRIMARY, reads to REPLICA