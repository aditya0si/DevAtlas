# PgBouncer connection pooler for PostgreSQL
# Routes writes to primary, reads to replica with transaction-level pooling

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devatlas-pgbouncer
  labels:
    app: devatlas
    component: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devatlas
      component: pgbouncer
  template:
    metadata:
      labels:
        app: devatlas
        component: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports:
            - containerPort: 5432
          env:
            - name: DATABASE_URL
              value: "postgres://devatlas:devatlas@postgres:5432/devatlas"
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "1000"
            - name: DEFAULT_POOL_SIZE
              value: "20"
            - name: MIN_POOL_SIZE
              value: "5"
            - name: RESERVE_POOL_SIZE
              value: "5"
            - name: RESERVE_POOL_TIMEOUT
              value: "3"
            - name: SERVER_LIFETIME
              value: "3600"
            - name: SERVER_IDLE_TIMEOUT
              value: "600"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  labels:
    app: devatlas
    component: pgbouncer
spec:
  selector:
    app: devatlas
    component: pgbouncer
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
# PgBouncer.ini configuration for reference:
# [databases]
# ; Primary for writes
# primary = host=postgres port=5432 dbname=devatlas
# ; Replica for reads (transaction pooling)
# replica = host=postgres-replica port=5432 dbname=devatlas
# ; Pool name for transaction routing
# devatlas = host=127.0.0.1 port=5432 dbname=devatlas
#
# [pgbouncer]
# pool_mode = transaction
# max_client_conn = 1000
# default_pool_size = 20