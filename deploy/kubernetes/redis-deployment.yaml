apiVersion: apps/v1
kind: Deployment
metadata:
  name: devatlas-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devatlas
      component: redis
  template:
    metadata:
      labels:
        app: devatlas
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: devatlas-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devatlas-redis-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: devatlas
    component: redis
  ports:
    - port: 6379
  clusterIP: None