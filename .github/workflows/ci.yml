name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: devatlas
          POSTGRES_PASSWORD: devatlas
          POSTGRES_DB: devatlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://devatlas:devatlas@localhost:5432/devatlas
      TEST_DATABASE_URL: postgresql+asyncpg://devatlas:devatlas@localhost:5432/devatlas
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - run: uv venv
      - run: uv pip install -r requirements.txt
      # Test/audit tooling is installed next to the app deps on purpose so that
      # backend/requirements.txt stays the runtime-only lockfile.
      - run: uv pip install pip-audit pytest-cov
      - run: uv run ruff check .
      # Coverage RATCHET, not a target: measured 68.27% on the first green CI run
      # (330 tests), so the floor sits just below the measured value. Raise
      # --cov-fail-under as tests are added; never lower it to make a failing run pass.
      # The backend job runs against real Postgres/Redis below.
      - run: uv run pytest -q --cov=app --cov-report=term-missing --cov-fail-under=65
      - run: uv run pip-audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --ci --watchAll=false
      - run: npm audit --audit-level=high

  # Smoke-test the SHIPPED artifact: the static export (`next build` →
  # output: 'export' → frontend/out) served at :4173, with no
  # NEXT_PUBLIC_FIREBASE_* configuration at all. That is the state a freshly
  # deployed bundle is in before any data lands in the data source, so the spec
  # asserts the page shell renders, the map container mounts and nothing throws.
  smoke:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      # No NEXT_PUBLIC_FIREBASE_* variables are defined for this job on purpose:
      # the smoke run must exercise the empty-data degraded state.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Serve the static export on :4173
        run: |
          npx --yes serve@14 out -l 4173 > serve.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::static export server never became ready"
          cat serve.log
          exit 1
      - run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
