groups:
  - name: devatlas_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "p95 latency is {{ $value }}s"

      - alert: HighMemoryUsage
        expr: memory_usage_percent > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}%"

      - alert: HighCPUUsage
        expr: cpu_usage_percent > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"

      - alert: GitHubRateLimitLow
        expr: github_api_rate_limit_remaining < 100
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "GitHub API rate limit running low"
          description: "Rate limit remaining: {{ $value }}"

      - alert: GitHubRateLimitExhausted
        expr: github_api_rate_limit_remaining < 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "GitHub API rate limit exhausted"
          description: "Rate limit remaining: {{ $value }}"

      - alert: JobQueueBacklog
        expr: arq_jobs_pending > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Background job queue backlog"
          description: "{{ $value }} jobs pending"

      - alert: JobFailureRate
        expr: rate(arq_jobs_failed_total[1h]) / rate(arq_jobs_processed_total[1h]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High job failure rate"
          description: "Job failure rate is {{ $value | humanizePercentage }}"

      - alert: RedisConnectionFailure
        expr: redis_connection_errors_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis connection failures"
          description: "{{ $value }} connection errors"

      - alert: DatabaseConnectionFailure
        expr: postgres_connection_errors_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL connection failures"
          description: "{{ $value }} connection errors"

      - alert: TokenReuseDetected
        expr: rate(auth_token_reuse_detected_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Potential token theft detected"
          description: "Token reuse detected - possible attack"

      - alert: WebSocketConnectionsHigh
        expr: websocket_connections_active > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of WebSocket connections"
          description: "{{ $value }} active connections"