global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "devatlas-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "devatlas-worker"
    static_configs:
      - targets: ["worker:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "devatlas-redis"
    static_configs:
      - targets: ["redis:6379"]
    scrape_interval: 30s

  - job_name: "devatlas-postgres"
    static_configs:
      - targets: ["postgres:5432"]
    scrape_interval: 30s